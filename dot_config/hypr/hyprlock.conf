general {
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/russian3.jpg
    
    blur_passes = 0
    blur_size = 0
    
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = rgba(255, 255, 255, 1)
    font_size = 94
    font_family = Noto Sans
    
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:10000] echo "$(date +'%A, %d %B')"
    color = rgba(255, 255, 255, 0.9)
    font_size = 22
    font_family = Noto Sans
    
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    inner_color = rgb(20, 20, 20)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##aaaaaa"><i>...</i></span>
    hide_input = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] echo "⚡ $(cat /sys/class/power_supply/BAT*/capacity)%"
    color = rgba(255, 255, 255, 0.6)
    font_size = 16
    font_family = Noto Sans
    
    position = 50, -50
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3600000] fortune -s | fold -w 50 -s
    color = rgba(255, 255, 255, 0.5)
    font_size = 14
    font_family = Noto Sans
    font_style = Italic
    
    position = 0, -150
    halign = center
    valign = center
}
