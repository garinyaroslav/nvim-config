################
### MONITORS ###
################

# extended mode
monitor=eDP-1,preferred,auto,auto
monitor=HDMI-A-1,preferred,auto,auto

# mirror mode
# monitor=eDP-1,preferred,auto,auto
# monitor=HDMI-A-1,preferred,auto,auto,mirror,eDP-1

workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1

###################
### MY PROGRAMS ###
###################

$terminal = ghostty
$fileManager = dolphin
$menu = wofi --show drun
$browser = firefox

# about:config for firefox to enable gpu acceleration and vaapi video decoding. You can set these by going to about:config in firefox and searching for the keys, then setting them to the values below.
# gfx.webrender.all → true
# gfx.webrender.compositor → true
# media.ffmpeg.vaapi.enabled → true
# media.hardware-video-decoding.force-enabled → true
# widget.dmabuf.force-enabled → true
# layers.acceleration.force-enabled → true
# gfx.webrender.software → false
# media.ffvpx.enabled → false

#################
### VARIABLES ###
#################

$waybarScripts = ~/.config/waybar/scripts

#################
### AUTOSTART ###
#################

exec-once = hyprpaper
exec-once = waybar
exec-once = clipse -listen
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

############
### ENVS ###
############

env = GRIMBLAST_EDITOR,satty --filename
env = XDG_SCREENSHOTS_DIR,$HOME/Pictures/Screenshots
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_MENU_PREFIX,arch-

# env = GBM_BACKEND,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = NVD_BACKEND,direct

env = __NV_PRIME_RENDER_OFFLOAD,1
env = __VK_LAYER_NV_optimus,NVIDIA_only
env = AQ_FORCE_LINEAR_BLIT,0
env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1

###################
### PERMISSIONS ###
###################

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 0
    gaps_out = 0

    border_size = 0

    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 3
    rounding_power = 3

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

#############
### INPUT ###
#############

input {
    kb_layout = us, ru
    kb_options = grp:alt_shift_toggle
    accel_profile = flat

    touchpad {
        natural_scroll = true
    }

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    repeat_delay = 250

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, F, fullscreen
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, escape, exec, hyprlock
bind = $mainMod, T, exec, prime-run $terminal
bind = $mainMod ALT, T, exec, [float] prime-run $terminal
bind = $mainMod SHIFT, W, exec, prime-run $browser
bind = $mainMod SHIFT, T, exec, prime-run Telegram
bind = $mainMod SHIFT, D, exec, prime-run discord
bind = $mainMod SHIFT, V, exec, throne
bind = $mainMod SHIFT, N, exec, $terminal -e wlctl
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, escape, exit,
bind = $mainMod SHIFT, F, exec, prime-run $fileManager
bind = $mainMod, G, togglefloating,
bind = $mainMod, R, exec, prime-run $menu
bind = $mainMod, P, exec, bash $waybarScripts/power
bind = $mainMod, SPACE, layoutmsg, togglesplit
bind = $mainMod SHIFT, S, exec, grimblast --freeze edit area
bind = $mainMod, S, exec, grimblast --freeze copysave area
bind = $mainMod, V, exec, [float] $terminal -e clipse
bind = $mainMod SHIFT, C, exec, $terminal -e nvim $HOME/.config/hypr/hyprland.conf
bind = $mainMod SHIFT, E, exec, bash -c "if tmux has-session 2>/dev/null; then prime-run ghostty -e tmux attach; else prime-run ghostty -e tmux; fi"
bind = $mainMod SHIFT, B, exec, $terminal -e btop 

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

bind = $mainMod CTRL, H, resizeactive, -80 0
bind = $mainMod CTRL, J, resizeactive, 0 80
bind = $mainMod CTRL, K, resizeactive, 0 -70
bind = $mainMod CTRL, L, resizeactive, 80 0

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, Tab, focusmonitor, +1
bind = $mainMod SHIFT, Tab, focusmonitor, -1

bind = $mainMod, mouse_up, workspace, m-1
bind = $mainMod, mouse_down, workspace, m+1
bind = $mainMod, period, workspace, m+1
bind = $mainMod, comma, workspace, m-1

#move and resizewindow
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# music
bind = $mainMod CTRL, Page_Up, exec, playerctl next
bind = $mainMod CTRL, Page_Down, exec, playerctl previous
bind = $mainMod CTRL, End, exec, playerctl play-pause

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

unbind = CONTROL, RETURN

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^(floating)$, float on
windowrule = match:class ^$ match:title ^$ match:xwayland 1 match:float 1 match:fullscreen 0 match:pin 0, no_focus on
